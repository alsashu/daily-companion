# Daily Companion: frontend (Nginx) -> backend (Express) -> postgres.
# Start with: docker compose up --build -d   (after: cp .env.example .env)

name: daily-companion

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty (first start).
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend-net
    # No ports published: PostgreSQL is reachable only from the internal network.

  backend:
    build: ./backend
    image: daily-companion-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # Uses the Compose service name "postgres", never localhost.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - backend-net
      - frontend-net

  frontend:
    build: ./frontend
    image: daily-companion-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    networks:
      - frontend-net

volumes:
  pgdata:

networks:
  # internal: containers on this network have no route to the outside world.
  backend-net:
    internal: true
  frontend-net:
